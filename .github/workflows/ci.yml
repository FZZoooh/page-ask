name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # The product targets Windows only and the regression scripts depend on USERPROFILE, so run on Windows directly
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify (i18n + types + server tests + build)
        run: pnpm verify
