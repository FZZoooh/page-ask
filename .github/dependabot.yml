version: 2

updates:
  # pnpm 走 npm 生态；Dependabot 会同时更新 package.json 与 pnpm-lock.yaml
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    # minor/patch 合并成组，major 单独开 PR，避免一次大升级混在噪声里
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    # katex 0.17+ 需要 rehype-katex 同步支持；当前 7.0.1 仍依赖 katex ^0.16，
    # 单独升级会导致「0.19 的 CSS + 0.16 的渲染标记」版本错位。
    ignore:
      - dependency-name: "katex"
        versions: [">=0.17.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"
