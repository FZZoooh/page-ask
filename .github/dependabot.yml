version: 2

updates:
  # pnpm uses the npm ecosystem; Dependabot updates both package.json and pnpm-lock.yaml
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    # minor/patch updates are grouped, major updates get their own PR, so one big upgrade does not drown in noise
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    # katex 0.17+ needs matching support in rehype-katex; 7.0.1 still depends on katex ^0.16,
    # so upgrading it alone would pair "0.19 CSS with 0.16 render markup".
    ignore:
      - dependency-name: "katex"
        versions: [">=0.17.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"
